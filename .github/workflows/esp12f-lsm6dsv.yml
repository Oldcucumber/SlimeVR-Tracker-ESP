name: ESP12F LSM6DSV Build

on:
  workflow_dispatch:
    inputs:
      i2c_speed:
        description: "ESP8266 I2C speed in Hz"
        required: true
        default: "400000"
      fusion_mode:
        description: "Experimental fusion profile for ESP12F + LSM6DSV"
        required: true
        type: choice
        default: "sflp"
        options:
          - sflp
          - vqf_fast
          - vqf_full
      sflp_odr_hz:
        description: "SFLP ODR in Hz; used only when fusion_mode=sflp"
        required: true
        type: choice
        default: "120"
        options:
          - "15"
          - "30"
          - "60"
          - "120"
          - "240"
          - "480"
      enable_telemetry:
        description: "Enable UDP telemetry"
        required: true
        type: boolean
        default: false
      telemetry_host:
        description: "Telemetry receiver IP; leave empty unless telemetry is enabled"
        required: false
        default: ""
      telemetry_broadcast:
        description: "Allow telemetry broadcast when telemetry_host is empty"
        required: true
        type: boolean
        default: false
      telemetry_logs:
        description: "Forward firmware logs through telemetry"
        required: true
        type: boolean
        default: true
      telemetry_interval_ms:
        description: "Telemetry performance interval in milliseconds"
        required: true
        default: "1000"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-esp12f-lsm6dsv

      - name: Get tags
        run: git fetch --quiet --tags origin --recurse-submodules=no --force

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO and its dependencies
        run: |
          echo "::group::Install Python packages"
          python -m pip install --upgrade --quiet pip
          pip install --upgrade --quiet platformio
          echo "::endgroup::"

      - name: Build ESP12F LSM6DSV firmware
        env:
          SLIMEVR_OVERRIDE_DEFAULTS: >-
            {"SENSORS":[{"protocol":"I2C","imu":"IMU_LSM6DSV","int":"13","rotation":"DEG_270","scl":"12","sda":"14"}],"BATTERY":{"type":"BAT_EXTERNAL","r1":100,"r2":220,"shieldR":180,"pin":"A0"},"LED":{"LED_PIN":"2","LED_INVERTED":true}}
        run: |
          mkdir -p build
          pio_build_flags="-DESP8266_LSM6DSV_EXPERIMENT=1 -DESP8266_I2C_SPEED=${{ inputs.i2c_speed }}"

          case "${{ inputs.fusion_mode }}" in
            sflp)
              pio_build_flags="$pio_build_flags -DLSM6DSV_SFLP_EXPERIMENT=1"
              pio_build_flags="$pio_build_flags -DLSM6DSV_SFLP_ODR_HZ=${{ inputs.sflp_odr_hz }}"
              pio_build_flags="$pio_build_flags -DSEND_ACCELERATION=0"
              ;;
            vqf_fast)
              pio_build_flags="$pio_build_flags -DVQF_NO_MOTION_BIAS_ESTIMATION"
              ;;
            vqf_full)
              ;;
            *)
              echo "::error::Unsupported fusion_mode '${{ inputs.fusion_mode }}'"
              exit 1
              ;;
          esac

          if [ "${{ inputs.enable_telemetry }}" = "true" ]; then
            pio_build_flags="$pio_build_flags -DENABLE_TELEMETRY=1"
            pio_build_flags="$pio_build_flags -DTELEMETRY_INTERVAL_MS=${{ inputs.telemetry_interval_ms }}"

            if [ "${{ inputs.telemetry_logs }}" = "false" ]; then
              pio_build_flags="$pio_build_flags -DENABLE_TELEMETRY_LOGS=0"
            fi

            telemetry_host="${{ inputs.telemetry_host }}"
            if [ -n "$telemetry_host" ]; then
              pio_build_flags="$pio_build_flags -DTELEMETRY_HOST=\\\"$telemetry_host\\\""
            elif [ "${{ inputs.telemetry_broadcast }}" = "true" ]; then
              pio_build_flags="$pio_build_flags -DTELEMETRY_BROADCAST=1"
            fi
          fi

          export SLIMEVR_EXTRA_BUILD_FLAGS="$pio_build_flags"
          echo "SLIMEVR_EXTRA_BUILD_FLAGS=$SLIMEVR_EXTRA_BUILD_FLAGS"

          echo "::group::PlatformIO build output"
          set +e
          platformio run -e BOARD_WEMOSD1MINI 2>&1 | tee build/platformio.log
          status=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"

          if [ "$status" -ne 0 ]; then
            echo "::error::PlatformIO build failed"
            echo "Last 200 lines of PlatformIO output:"
            tail -n 200 build/platformio.log
            exit "$status"
          fi

      - name: Prepare firmware artifact
        run: |
          cp .pio/build/BOARD_WEMOSD1MINI/firmware.bin build/ESP12F_LSM6DSV-firmware.bin

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esp12f-lsm6dsv-build-log
          path: build/platformio.log
          if-no-files-found: ignore

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: esp12f-lsm6dsv-firmware
          path: build/ESP12F_LSM6DSV-firmware.bin
